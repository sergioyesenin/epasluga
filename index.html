<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Content-Security-Policy подставляется сюда при сборке (vite.config.ts → cspPlugin):
         dev-сервер Vite вставляет инлайн-скрипты и стили, строгая политика ему мешает -->
    <!--csp-->
    <title>Е-Паслуга — личный кабинет</title>
    <meta
      name="description"
      content="Учебный прототип личного кабинета Е-Паслуги: услуги, заявления, документы и семейный раздел «Далонь». Работает как приложение и без сети."
    />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Учебный прототип госпортала: не индексировать, чтобы его не приняли за настоящий.
         В продукте заменить на index, follow и добавить canonical. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Превью ссылки в мессенджерах. og:image и og:url требуют абсолютного адреса —
         добавить, когда будет домен. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ru_BY" />
    <meta property="og:site_name" content="Е-Паслуга" />
    <meta property="og:title" content="Е-Паслуга — личный кабинет (прототип)" />
    <meta
      property="og:description"
      content="Госуслуги Беларуси в одном кабинете: жизненные ситуации, заявления, документы и семейный раздел «Далонь». Учебный прототип, данные условные."
    />
    <meta name="twitter:card" content="summary" />

    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Е-Паслуга" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
